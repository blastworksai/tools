  <rect class="surface" x="540" y="132" width="370" height="300" rx="8"/><text class="muted" x="566" y="160" font-size="11">CHECKPOINT</text><text x="566" y="190" font-size="13">Work: builder-01</text><text x="566" y="216" font-size="13">Done: unit tests written</text><text x="566" y="242" font-size="13">Remaining: integration suite</text><text x="566" y="268" font-size="13">Checks: 3 passed @ a1b2c3d</text><line x1="566" y1="290" x2="884" y2="290" stroke="var(--border)"/><text class="warning" x="566" y="320" font-size="12">Transcript: not copied</text><text class="success" x="566" y="346" font-size="12">Fresh context: yes</text><text class="success" x="566" y="372" font-size="12">Predecessor alive until accepted</text><text class="muted" x="566" y="398" font-size="12">Uncertain effects: never retried</text>
