    .button { fill: var(--surface); stroke: var(--accent); }
    .accent { fill: var(--accent); }
    .success { fill: var(--success); }
    .warning { fill: var(--warning); }
  </style>
  <rect class="surface" x="28" y="24" width="944" height="522" rx="12"/>
  <text x="58" y="62" font-size="20">Rollover · builder-01</text><text class="muted" x="58" y="88" font-size="12">fresh context only · verified checkpoint · no transcript transfer</text>
